<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Style -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- script -->
    <script src="assets/js/script.js" defer></script>
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Genpass</title>
  </head>
  <body>
    <div id="register-container">
      <div id="register-banner">
        <div id="banner-layer">
          <h1>Seja bem-vindo</h1>
        </div>
      </div>
      <div id="register-form">
        <h2>Crie sua conta</h2>
        <p>Registre-se para utilizar todas as funcionalidades do sistema</p>
        <div class="form-control">
          <label for="name">Nome</label>
          <input
            type="text"
            name="name"
            id="name"
            placeholder="Digite seu nome Completo" autocomplete="off"
          />
        </div>
        <div class="form-control">
          <label for="email">E-mail</label>
          <input
            type="text"
            name="email"
            id="email"
            placeholder="Digite seu e-mail" autocomplete="off"
          />
        </div>
        <div class="form-control">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            placeholder="Digite a sua senha"
          />

          <div id="password-strength">
            <div id="strength-bar"></div>
          </div>
          <span id="strength-label"></span>
        </div>
        <p>
          Precisa de ajuda para criar uma senha segura?
          <span id="generate-password">Clique aqui</span>
        </p>

        <div id="generate-options" class="hide">
          <p>Selecione as opções que deseja</p>
          <div class="form-control">
            <label for="Length">Quantidade de caracteres</label>
            <input type="text" id="length" name="length" value="10">
          </div>

          <div class="form-control">
            <label for="letters">Letras</label>
            <input type="checkbox" id="letters" name="letters" checked>
          </div>

          <div class="form-control">
            <label for="number">Números</label>
            <input type="checkbox" id="number" name="number" checked>
          </div>

          <div class="form-control">
            <label for="symbols">Símbolos</label>
            <input type="checkbox" id="symbols" name="symbols" checked>
          </div>
          <button id="up-password">Gerar senha</button>
        </div>
        <div id="open-generated-password">
          <p>Aqui está a sua senha:</p>
          <h4></h4>
          <button type="button" id="copy-password">Copiar</button>
        </div>

        <div class="form-control">
          <label for="confirmpassword">confirmação de Senha</label>
          <input
            type="confirmpassword"
            id="confirmpassword"
            placeholder="Digite confirme a sua senha"
          />
        </div>
        <input type="submit" value="Cadastrar" />
      </div>
    </div>
    <div id="toast">Senha Copiada!</div>
  </body>
</html>
